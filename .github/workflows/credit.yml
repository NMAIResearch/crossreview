name: Review credit

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: crossreview-credit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  credit:
    if: github.event_name == 'workflow_dispatch' || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && (github.event.label.name == 'submission' || github.event.label.name == 'review')) || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') && (contains(github.event.issue.labels.*.name, 'submission') || contains(github.event.issue.labels.*.name, 'review')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark credit checks pending
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, labels: 'submission', state: 'open', per_page: 100
            });
            for (const issue of issues.filter(i => !i.pull_request)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['credit-pending'] });
            }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compute the complete review ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B tools/reciprocity.py --ledger > credit.json
      - name: Refresh open submissions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ledger = JSON.parse(fs.readFileSync('credit.json', 'utf8'));
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, labels: 'submission', state: 'open', per_page: 100
            });
            for (const issue of issues.filter(i => !i.pull_request)) {
              const state = ledger[issue.user.login.toLowerCase()];
              if (!state) throw new Error(`Submission author absent from complete ledger: #${issue.number}`);
              if (!Array.isArray(state.eligible_submissions)) throw new Error('Missing per-submission eligibility');
              const eligible = state.eligible_submissions.includes(issue.number);
              const desired = eligible ? 'credit-cleared' : 'needs-review-credit';
              const stale = eligible ? 'needs-review-credit' : 'credit-cleared';
              const names = new Set(issue.labels.map(l => l.name));
              if (names.has(stale)) await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: stale });
              if (!names.has(desired)) await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [desired] });
              if (names.has('credit-pending')) await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'credit-pending' });
            }
